name: Paper 2 ARM disk probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disk-probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Record disk before cleanup
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paper2-arm-disk-probe-receipts" "$RUNNER_TEMP/paper2-production/control"
          df -B1 --output=source,size,used,avail,target "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/paper2-arm-disk-probe-receipts/df-before.txt"
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'paper2-arm-disk-probe-receipts'
          memory={line.split(':')[0]:line.split(':',1)[1].strip() for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith(('MemTotal:', 'MemAvailable:'))}
          receipt=dict(purpose='DISK PROBE ONLY; no experiment; excluded from G3',runner_label='ubuntu-24.04-arm',os=platform.platform(),nproc=int(subprocess.check_output(['nproc'])),memory=memory,image={k:os.environ.get(k,'NOT RECORDED') for k in ('ImageOS','ImageVersion','RUNNER_OS','RUNNER_ARCH')},mount_paths={k:os.environ[k] for k in ('GITHUB_WORKSPACE','RUNNER_TEMP')})
          (root/'host.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Identical rehearsal cleanup
        shell: bash
        run: |
          python3 -c 'import json,shutil; from pathlib import Path; p=Path(__import__("os").environ["RUNNER_TEMP"])/"paper2-production/control/disk-cleanup.json"; p.write_text(json.dumps({"before_bytes":shutil.disk_usage(p.parent).free}))'
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          python3 -c 'import json,shutil; from pathlib import Path; p=Path(__import__("os").environ["RUNNER_TEMP"])/"paper2-production/control/disk-cleanup.json"; d=json.loads(p.read_text()); d["after_bytes"]=shutil.disk_usage(p.parent).free; p.write_text(json.dumps(d)); print(json.dumps(d))'
      - name: Record disk after cleanup and seal receipts
        if: always()
        shell: bash
        run: |
          df -B1 --output=source,size,used,avail,target "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/paper2-arm-disk-probe-receipts/df-after.txt"
          if test -f "$RUNNER_TEMP/paper2-production/control/disk-cleanup.json"; then
            cp "$RUNNER_TEMP/paper2-production/control/disk-cleanup.json" "$RUNNER_TEMP/paper2-arm-disk-probe-receipts/"
          fi
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'paper2-arm-disk-probe-receipts'
          paths=sorted(p for p in root.iterdir() if p.is_file() and p.name!='SHA256SUMS')
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in paths))
          PY
      - name: Upload disk-only receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paper2-arm-disk-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/paper2-arm-disk-probe-receipts/
          if-no-files-found: error
