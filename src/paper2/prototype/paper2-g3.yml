name: Paper 2 G3 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g3:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set runner-temp paths
        shell: bash
        run: |
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-pycache" >> "$GITHUB_ENV"
          echo "G3_ARTIFACTS=$RUNNER_TEMP/paper2-g3-artifacts" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bounded build, conformance, calibration and validation
        shell: bash
        run: |
          mkdir -p "$G3_ARTIFACTS"
          export G3_NATIVE="$RUNNER_TEMP/paper2-native"
          export OQS_INSTALL_PATH="$G3_NATIVE/liboqs"
          export LD_LIBRARY_PATH="$G3_NATIVE/openssl/lib:$G3_NATIVE/liboqs/lib:${LD_LIBRARY_PATH:-}"
          export OPENSSL_MODULES="$G3_NATIVE/openssl/lib/ossl-modules"
          timeout --signal=TERM --kill-after=10s 280m bash -euo pipefail <<'G3'
          python -m src.paper2.prototype.runner --record-start "$G3_ARTIFACTS"
          cp BUNDLE_MANIFEST.json BUNDLE_MANIFEST.sha256 "$G3_ARTIFACTS/"
          cp research/paper2/phase5/RUNTIME_PLAN.md src/paper2/prototype/source_pins.json "$G3_ARTIFACTS/"
          timeout --signal=TERM --kill-after=10s 40m bash -euo pipefail <<'BUILD' || { tail -n 60 "$G3_ARTIFACTS/native-build.log"; exit 1; }
          python -m pip install --disable-pip-version-check cryptography==45.0.7
          python -m src.paper2.prototype.runner --record-host "$G3_ARTIFACTS"
          python -m src.paper2.prototype.export --verify-bundle .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build perl
          python -m src.paper2.prototype.provision --stage build --root "$G3_NATIVE" --artifacts "$G3_ARTIFACTS" --execute
          BUILD
          timeout --signal=TERM --kill-after=10s 15m python -m src.paper2.prototype.provision --stage conformance --root "$G3_NATIVE" --artifacts "$G3_ARTIFACTS" --execute
          python -m unittest discover -s tests/paper2 -p 'test_phase5a*.py' -v > "$G3_ARTIFACTS/local-tests.txt" 2>&1 || { tail -n 60 "$G3_ARTIFACTS/local-tests.txt"; exit 1; }
          python -m src.paper2.prototype.runner --output "$G3_ARTIFACTS" --execute
          G3
      - name: Hash all artifacts, including partial failures
        if: always()
        timeout-minutes: 2
        run: python -m src.paper2.prototype.runner --hash-artifacts "$G3_ARTIFACTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 8
        with:
          name: paper2-g3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paper2-g3-artifacts/
          if-no-files-found: error
          retention-days: 30
