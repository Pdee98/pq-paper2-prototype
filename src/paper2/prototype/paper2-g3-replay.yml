name: Paper 2 G3 deterministic replay
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ARM measurement workflow run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      code_commit: ${{ steps.inputs.outputs.code_commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Set runner-temp paths
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-replay-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paper2-g3-replay-inputs-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs
      - name: Verify all inputs and generate exact eligible-run matrix
        id: inputs
        run: python -m src.paper2.prototype.replay prepare --inputs "$RUNNER_TEMP/inputs" --source-run-id "$SOURCE_RUN_ID"
  matrix:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      REPLAY_RUN_ID: ${{ matrix.run_id }}
    steps:
      - name: Set runner-temp paths
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-replay-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.code_commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paper2-g3-replay-inputs-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs
      - name: Replay primary and held-out inputs, check invariants and compare
        run: python -m src.paper2.prototype.replay run --inputs "$RUNNER_TEMP/inputs" --source-run-id "$SOURCE_RUN_ID" --run-id "$REPLAY_RUN_ID" --output "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paper2-g3-replay-result-${{ github.run_id }}-${{ matrix.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30
  gather:
    needs: [prepare, matrix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Set runner-temp paths
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-replay-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.code_commit || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: paper2-g3-replay-inputs-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: paper2-g3-replay-result-${{ github.run_id }}-*
          path: ${{ runner.temp }}/results
      - name: Gather every repetition; missing or corrupt results fail G3
        run: python -m src.paper2.prototype.replay gather --inputs "$RUNNER_TEMP/inputs" --source-run-id "$SOURCE_RUN_ID" --results "$RUNNER_TEMP/results" --output "$RUNNER_TEMP/g3-report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paper2-g3-replay-report-${{ github.run_id }}
          path: ${{ runner.temp }}/g3-report/
          if-no-files-found: error
          retention-days: 30
