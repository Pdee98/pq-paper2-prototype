name: Paper 2 G3 deterministic replay
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: XMSS 7X source run ID (or the diagnostic source)
        required: true
        type: string
      ml_dsa_source_run_id:
        description: ML-DSA 7M source run ID; required for validation
        required: false
        type: string
      source_kind:
        description: Validation or excluded diagnostic evidence
        required: true
        default: validation
        type: choice
        options: [validation, diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      code_commit: ${{ steps.inputs.outputs.code_commit }}
    env:
      PAPER2_RUNNER_LABEL: ubuntu-24.04
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ML_DSA_RUN_ID: ${{ inputs.ml_dsa_source_run_id }}
      REPLAY_MODULE: ${{ inputs.source_kind == 'diagnostic' && 'src.paper2.prototype.diagnostic' || 'src.paper2.prototype.replay' }}
    steps:
      - name: Set runner-temp paths
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-replay-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paper2-g3-${{ inputs.source_kind == 'diagnostic' && 'diagnostic' || 'replay' }}-inputs-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/${{ inputs.source_kind == 'diagnostic' && 'inputs' || 'source-x' }}
      - name: Download second validation source (7M)
        if: inputs.source_kind == 'validation'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paper2-g3-replay-inputs-${{ inputs.ml_dsa_source_run_id }}
          run-id: ${{ inputs.ml_dsa_source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-m
      - name: Verify same-commit completed 7X and 7M sources and form strict union
        if: inputs.source_kind == 'validation'
        run: python -m src.paper2.prototype.split_replay --xmss "$RUNNER_TEMP/source-x" --ml-dsa "$RUNNER_TEMP/source-m" --xmss-run-id "$SOURCE_RUN_ID" --ml-dsa-run-id "$SOURCE_ML_DSA_RUN_ID" --output "$RUNNER_TEMP/inputs"
      - name: Verify all inputs and generate exact eligible-run matrix
        id: inputs
        run: python -m "$REPLAY_MODULE" prepare --inputs "$RUNNER_TEMP/inputs" --source-run-id "$SOURCE_RUN_ID"
  matrix:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PAPER2_RUNNER_LABEL: ubuntu-24.04
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ML_DSA_RUN_ID: ${{ inputs.ml_dsa_source_run_id }}
      REPLAY_MODULE: ${{ inputs.source_kind == 'diagnostic' && 'src.paper2.prototype.diagnostic' || 'src.paper2.prototype.replay' }}
      REPLAY_RUN_ID: ${{ matrix.run_id }}
      REPLAY_TIMEOUT_MINUTES: ${{ matrix.timeout_minutes }}
    steps:
      - name: Set runner-temp paths
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-replay-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.code_commit }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paper2-g3-${{ inputs.source_kind == 'diagnostic' && 'diagnostic' || 'replay' }}-inputs-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/${{ inputs.source_kind == 'diagnostic' && 'inputs' || 'source-x' }}
      - name: Download second validation source (7M)
        if: inputs.source_kind == 'validation'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paper2-g3-replay-inputs-${{ inputs.ml_dsa_source_run_id }}
          run-id: ${{ inputs.ml_dsa_source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-m
      - name: Verify same-commit completed 7X and 7M sources and form strict union
        if: inputs.source_kind == 'validation'
        run: python -m src.paper2.prototype.split_replay --xmss "$RUNNER_TEMP/source-x" --ml-dsa "$RUNNER_TEMP/source-m" --xmss-run-id "$SOURCE_RUN_ID" --ml-dsa-run-id "$SOURCE_ML_DSA_RUN_ID" --output "$RUNNER_TEMP/inputs"
      - name: Replay primary and held-out inputs, check invariants and compare
        run: timeout --signal=TERM --kill-after=30s "$((REPLAY_TIMEOUT_MINUTES - 5))m" python -m "$REPLAY_MODULE" run --inputs "$RUNNER_TEMP/inputs" --source-run-id "$SOURCE_RUN_ID" --run-id "$REPLAY_RUN_ID" --output "$RUNNER_TEMP/result"
      - name: Verified upload inventory 1
        id: inventory_verified_1
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/result/replay-progress.jsonl
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 1
        id: seal_verified_1
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/result/replay-progress.jsonl
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - name: Preserve flushed replay progress, including timeout evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.inventory_verified_1.outcome == 'success' && steps.seal_verified_1.outcome == 'success'
        with:
          name: paper2-g3-replay-progress-${{ github.run_id }}-${{ matrix.run_id }}
          path: ${{ runner.temp }}/result/replay-progress.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Verified upload inventory 2
        id: inventory_verified_2
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/result/
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 2
        id: seal_verified_2
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/result/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.inventory_verified_2.outcome == 'success' && steps.seal_verified_2.outcome == 'success'
        with:
          name: paper2-g3-replay-result-${{ github.run_id }}-${{ matrix.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve UNVERIFIED failure evidence only
        id: failure_evidence
        if: failure() || cancelled()
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
          EVIDENCE_0: ${{ runner.temp }}/result/replay-progress.jsonl
          EVIDENCE_1: ${{ runner.temp }}/result/
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paper2-failure-evidence"
          echo "UNVERIFIED: failed attempt; inspection only; forbidden as replay or authorization input" > "$RUNNER_TEMP/paper2-failure-evidence/UNVERIFIED"
          if [ -f src/paper2/prototype/failure_evidence.py ]; then
            python -m src.paper2.prototype.failure_evidence --output "$RUNNER_TEMP/paper2-failure-evidence" "$EVIDENCE_0" "$EVIDENCE_1"
          else
            if [ -d "$RUNNER_TEMP/paper2-production/control" ]; then cp -al "$RUNNER_TEMP/paper2-production/control" "$RUNNER_TEMP/paper2-failure-evidence/early-control"; fi
          fi
          if [ -d "$RUNNER_TEMP/paper2-production/failure-upload" ]; then cp -a "$RUNNER_TEMP/paper2-production/failure-upload/." "$RUNNER_TEMP/paper2-failure-evidence/"; fi
      - name: Upload UNVERIFIED failed attempt evidence
        if: (failure() || cancelled()) && steps.failure_evidence.outcome == 'success'
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-attempt-evidence-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/paper2-failure-evidence/
          if-no-files-found: error
          retention-days: 30
  gather:
    needs: [prepare, matrix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PAPER2_RUNNER_LABEL: ubuntu-24.04
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ML_DSA_RUN_ID: ${{ inputs.ml_dsa_source_run_id }}
      REPLAY_MODULE: ${{ inputs.source_kind == 'diagnostic' && 'src.paper2.prototype.diagnostic' || 'src.paper2.prototype.replay' }}
    steps:
      - name: Set runner-temp paths
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-replay-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.code_commit || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: paper2-g3-${{ inputs.source_kind == 'diagnostic' && 'diagnostic' || 'replay' }}-inputs-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/${{ inputs.source_kind == 'diagnostic' && 'inputs' || 'source-x' }}
      - name: Download second validation source (7M)
        if: inputs.source_kind == 'validation'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paper2-g3-replay-inputs-${{ inputs.ml_dsa_source_run_id }}
          run-id: ${{ inputs.ml_dsa_source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-m
      - name: Verify same-commit completed 7X and 7M sources and form strict union
        if: inputs.source_kind == 'validation'
        run: python -m src.paper2.prototype.split_replay --xmss "$RUNNER_TEMP/source-x" --ml-dsa "$RUNNER_TEMP/source-m" --xmss-run-id "$SOURCE_RUN_ID" --ml-dsa-run-id "$SOURCE_ML_DSA_RUN_ID" --output "$RUNNER_TEMP/inputs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: paper2-g3-replay-result-${{ github.run_id }}-*
          path: ${{ runner.temp }}/results
      - name: Gather every repetition; missing or corrupt results fail G3
        run: python -m "$REPLAY_MODULE" gather --inputs "$RUNNER_TEMP/inputs" --source-run-id "$SOURCE_RUN_ID" --results "$RUNNER_TEMP/results" --output "$RUNNER_TEMP/g3-report"
      - name: Verified upload inventory 1
        id: inventory_verified_1
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/g3-report/
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 1
        id: seal_verified_1
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/g3-report/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.inventory_verified_1.outcome == 'success' && steps.seal_verified_1.outcome == 'success'
        with:
          name: paper2-g3-replay-report-${{ github.run_id }}
          path: ${{ runner.temp }}/g3-report/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve UNVERIFIED failure evidence only
        id: failure_evidence
        if: failure() || cancelled()
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
          EVIDENCE_0: ${{ runner.temp }}/g3-report/
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paper2-failure-evidence"
          echo "UNVERIFIED: failed attempt; inspection only; forbidden as replay or authorization input" > "$RUNNER_TEMP/paper2-failure-evidence/UNVERIFIED"
          if [ -f src/paper2/prototype/failure_evidence.py ]; then
            python -m src.paper2.prototype.failure_evidence --output "$RUNNER_TEMP/paper2-failure-evidence" "$EVIDENCE_0"
          else
            if [ -d "$RUNNER_TEMP/paper2-production/control" ]; then cp -al "$RUNNER_TEMP/paper2-production/control" "$RUNNER_TEMP/paper2-failure-evidence/early-control"; fi
          fi
          if [ -d "$RUNNER_TEMP/paper2-production/failure-upload" ]; then cp -a "$RUNNER_TEMP/paper2-production/failure-upload/." "$RUNNER_TEMP/paper2-failure-evidence/"; fi
      - name: Upload UNVERIFIED failed attempt evidence
        if: (failure() || cancelled()) && steps.failure_evidence.outcome == 'success'
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-attempt-evidence-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/paper2-failure-evidence/
          if-no-files-found: error
          retention-days: 30
