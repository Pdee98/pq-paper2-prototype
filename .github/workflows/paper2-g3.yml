        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.upload3.outputs.artifact-id }}
          path: ${{ runner.temp }}/paper2-production/verified/3/
          merge-multiple: true
      - name: Verify uploaded ZIP digest, contents and raw round-trip; release raw slot 3
        if: steps.slot3.outputs.present == 'true'
        env:
          ARTIFACT_ID: ${{ steps.upload3.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload3.outputs.artifact-digest }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$G3_ROOT/verified-3.zip"
          python -m src.paper2.prototype.production ack --root "$G3_ROOT/control" --downloaded "$G3_ROOT/verified/3" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --uploaded-zip "$G3_ROOT/verified-3.zip"
      - name: Measure and seal slot 4
        id: slot4
        run: python -m src.paper2.prototype.production run --root "$G3_ROOT/control" --slot 4
      - name: Verified upload inventory 5
        id: inventory_verified_5
        if: success() && steps.slot4.outcome == 'success' && steps.slot4.outputs.present == 'true'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-production/upload/4/
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 5
        id: seal_verified_5
        if: success() && steps.slot4.outcome == 'success' && steps.slot4.outputs.present == 'true'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-production/upload/4/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - name: Upload canonical packet 4
        id: upload4
        if: success() && steps.slot4.outcome == 'success' && steps.slot4.outputs.present == 'true' && steps.inventory_verified_5.outcome == 'success' && steps.seal_verified_5.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paper2-g3-packet-${{ github.run_id }}-4
          path: ${{ runner.temp }}/paper2-production/upload/4/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Download immutable uploaded packet 4
        if: steps.slot4.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.upload4.outputs.artifact-id }}
          path: ${{ runner.temp }}/paper2-production/verified/4/
          merge-multiple: true
      - name: Verify uploaded ZIP digest, contents and raw round-trip; release raw slot 4
        if: steps.slot4.outputs.present == 'true'
        env:
          ARTIFACT_ID: ${{ steps.upload4.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload4.outputs.artifact-digest }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$G3_ROOT/verified-4.zip"
          python -m src.paper2.prototype.production ack --root "$G3_ROOT/control" --downloaded "$G3_ROOT/verified/4" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --uploaded-zip "$G3_ROOT/verified-4.zip"
      - name: Measure and seal slot 5
        id: slot5
        run: python -m src.paper2.prototype.production run --root "$G3_ROOT/control" --slot 5
      - name: Verified upload inventory 6
        id: inventory_verified_6
        if: success() && steps.slot5.outcome == 'success' && steps.slot5.outputs.present == 'true'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-production/upload/5/
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 6
        id: seal_verified_6
        if: success() && steps.slot5.outcome == 'success' && steps.slot5.outputs.present == 'true'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-production/upload/5/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - name: Upload canonical packet 5
        id: upload5
        if: success() && steps.slot5.outcome == 'success' && steps.slot5.outputs.present == 'true' && steps.inventory_verified_6.outcome == 'success' && steps.seal_verified_6.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paper2-g3-packet-${{ github.run_id }}-5
          path: ${{ runner.temp }}/paper2-production/upload/5/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Download immutable uploaded packet 5
        if: steps.slot5.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.upload5.outputs.artifact-id }}
          path: ${{ runner.temp }}/paper2-production/verified/5/
          merge-multiple: true
      - name: Verify uploaded ZIP digest, contents and raw round-trip; release raw slot 5
        if: steps.slot5.outputs.present == 'true'
        env:
