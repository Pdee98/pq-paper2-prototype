          EVIDENCE_3: ${{ runner.temp }}/paper2-production/upload/3/
          EVIDENCE_4: ${{ runner.temp }}/paper2-production/upload/4/
          EVIDENCE_5: ${{ runner.temp }}/paper2-production/upload/5/
          EVIDENCE_6: ${{ runner.temp }}/paper2-production/upload/6/
          EVIDENCE_7: ${{ runner.temp }}/paper2-production/upload/7/
          EVIDENCE_8: ${{ runner.temp }}/paper2-production/upload/8/
          EVIDENCE_9: ${{ runner.temp }}/paper2-production/upload/9/
          EVIDENCE_10: ${{ runner.temp }}/paper2-production/upload/10/
          EVIDENCE_11: ${{ runner.temp }}/paper2-production/upload/11/
          EVIDENCE_12: ${{ runner.temp }}/paper2-production/upload/12/
          EVIDENCE_13: ${{ runner.temp }}/paper2-production/upload/13/
          EVIDENCE_14: ${{ runner.temp }}/paper2-production/upload/14/
          EVIDENCE_15: ${{ runner.temp }}/paper2-production/upload/15/
          EVIDENCE_16: ${{ runner.temp }}/paper2-production/upload/16/
          EVIDENCE_17: ${{ runner.temp }}/paper2-production/upload/17/
          EVIDENCE_18: ${{ runner.temp }}/paper2-production/upload/18/
          EVIDENCE_19: ${{ runner.temp }}/paper2-production/upload/19/
          EVIDENCE_20: ${{ runner.temp }}/paper2-production/upload/20/
          EVIDENCE_21: ${{ runner.temp }}/paper2-production/upload/21/
          EVIDENCE_22: ${{ runner.temp }}/paper2-production/upload/22/
          EVIDENCE_23: ${{ runner.temp }}/paper2-production/upload/23/
          EVIDENCE_24: ${{ runner.temp }}/paper2-production/upload/24/
          EVIDENCE_25: ${{ runner.temp }}/paper2-production/control-upload/
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paper2-failure-evidence"
          echo "UNVERIFIED: failed attempt; inspection only; forbidden as replay or authorization input" > "$RUNNER_TEMP/paper2-failure-evidence/UNVERIFIED"
          if [ -f src/paper2/prototype/failure_evidence.py ]; then
            python -m src.paper2.prototype.failure_evidence --output "$RUNNER_TEMP/paper2-failure-evidence" "$EVIDENCE_0" "$EVIDENCE_1" "$EVIDENCE_2" "$EVIDENCE_3" "$EVIDENCE_4" "$EVIDENCE_5" "$EVIDENCE_6" "$EVIDENCE_7" "$EVIDENCE_8" "$EVIDENCE_9" "$EVIDENCE_10" "$EVIDENCE_11" "$EVIDENCE_12" "$EVIDENCE_13" "$EVIDENCE_14" "$EVIDENCE_15" "$EVIDENCE_16" "$EVIDENCE_17" "$EVIDENCE_18" "$EVIDENCE_19" "$EVIDENCE_20" "$EVIDENCE_21" "$EVIDENCE_22" "$EVIDENCE_23" "$EVIDENCE_24" "$EVIDENCE_25" "$RUNNER_TEMP/paper2-production/control" "$RUNNER_TEMP/paper2-production/working" "$RUNNER_TEMP/paper2-production/packet"
          else
            if [ -d "$RUNNER_TEMP/paper2-production/control" ]; then cp -al "$RUNNER_TEMP/paper2-production/control" "$RUNNER_TEMP/paper2-failure-evidence/early-control"; fi
          fi
          if [ -d "$RUNNER_TEMP/paper2-production/failure-upload" ]; then cp -a "$RUNNER_TEMP/paper2-production/failure-upload/." "$RUNNER_TEMP/paper2-failure-evidence/"; fi
      - name: Upload UNVERIFIED failed attempt evidence
        if: (failure() || cancelled()) && steps.failure_evidence.outcome == 'success'
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-attempt-evidence-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/paper2-failure-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Stop aggregate monitor after evidence handling
        if: always()
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
        run: touch "$RUNNER_TEMP/paper2-production/WATCHDOG_STOP"
