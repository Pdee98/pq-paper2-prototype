        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 3
        id: seal_verified_3
        if: success() && steps.slot2.outcome == 'success' && steps.slot2.outputs.present == 'true'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-production/upload/2/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - name: Upload canonical packet 2
        id: upload2
        if: success() && steps.slot2.outcome == 'success' && steps.slot2.outputs.present == 'true' && steps.inventory_verified_3.outcome == 'success' && steps.seal_verified_3.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paper2-g3-packet-${{ github.run_id }}-2
          path: ${{ runner.temp }}/paper2-production/upload/2/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Download immutable uploaded packet 2
        if: steps.slot2.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.upload2.outputs.artifact-id }}
          path: ${{ runner.temp }}/paper2-production/verified/2/
          merge-multiple: true
      - name: Verify uploaded ZIP digest, contents and raw round-trip; release raw slot 2
        if: steps.slot2.outputs.present == 'true'
        env:
          ARTIFACT_ID: ${{ steps.upload2.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload2.outputs.artifact-digest }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$G3_ROOT/verified-2.zip"
          python -m src.paper2.prototype.production ack --root "$G3_ROOT/control" --downloaded "$G3_ROOT/verified/2" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --uploaded-zip "$G3_ROOT/verified-2.zip"
      - name: Measure and seal slot 3
        id: slot3
        run: python -m src.paper2.prototype.production run --root "$G3_ROOT/control" --slot 3
      - name: Verified upload inventory 4
        id: inventory_verified_4
        if: success() && steps.slot3.outcome == 'success' && steps.slot3.outputs.present == 'true'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-production/upload/3/
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 4
        id: seal_verified_4
        if: success() && steps.slot3.outcome == 'success' && steps.slot3.outputs.present == 'true'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-production/upload/3/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - name: Upload canonical packet 3
        id: upload3
        if: success() && steps.slot3.outcome == 'success' && steps.slot3.outputs.present == 'true' && steps.inventory_verified_4.outcome == 'success' && steps.seal_verified_4.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paper2-g3-packet-${{ github.run_id }}-3
          path: ${{ runner.temp }}/paper2-production/upload/3/
