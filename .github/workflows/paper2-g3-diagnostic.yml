name: Paper 2 G3 ARM diagnostic v5 (excluded from G3)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g3:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      PAPER2_RUNNER_LABEL: ubuntu-24.04-arm
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set runner-temp paths
        shell: bash
        run: |
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-pycache" >> "$GITHUB_ENV"
          echo "G3_ARTIFACTS=$RUNNER_TEMP/paper2-g3-diagnostic-artifacts" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: DIAGNOSTIC v5 build, two-backend calibration and three prototype runs
        shell: bash
        run: |
          mkdir -p "$G3_ARTIFACTS"
          export G3_NATIVE="$RUNNER_TEMP/paper2-native"
          export OQS_INSTALL_PATH="$G3_NATIVE/liboqs"
          export LD_LIBRARY_PATH="$G3_NATIVE/openssl/lib:$G3_NATIVE/liboqs/lib:${LD_LIBRARY_PATH:-}"
          export OPENSSL_MODULES="$G3_NATIVE/openssl/lib/ossl-modules"
          timeout --signal=TERM --kill-after=10s 165m bash -euo pipefail <<'G3'
          python -m src.paper2.prototype.diagnostic preflight
          python -m src.paper2.prototype.runner --record-start "$G3_ARTIFACTS"
          cp BUNDLE_MANIFEST.json BUNDLE_MANIFEST.sha256 "$G3_ARTIFACTS/"
          cp src/paper2/prototype/source_pins.json "$G3_ARTIFACTS/"
          timeout --signal=TERM --kill-after=10s 40m bash -euo pipefail <<'BUILD' || { tail -n 60 "$G3_ARTIFACTS/native-build.log"; exit 1; }
          python -m pip install --disable-pip-version-check cryptography==45.0.7
          python -m src.paper2.prototype.runner --record-host "$G3_ARTIFACTS"
          python -m src.paper2.prototype.export --verify-bundle .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build perl
          python -m src.paper2.prototype.provision --stage build --root "$G3_NATIVE" --artifacts "$G3_ARTIFACTS" --execute
          BUILD
          timeout --signal=TERM --kill-after=10s 15m python -m src.paper2.prototype.provision --stage conformance --root "$G3_NATIVE" --artifacts "$G3_ARTIFACTS" --execute
          python -m unittest discover -s tests/paper2 -p 'test_phase5a*.py' -v > "$G3_ARTIFACTS/local-tests.txt" 2>&1 || { tail -n 60 "$G3_ARTIFACTS/local-tests.txt"; exit 1; }
          python -m src.paper2.prototype.diagnostic collect --output "$G3_ARTIFACTS"
          G3
      - name: Audit public corpus before any upload
        id: corpus_audit
        if: always()
        run: python -m src.paper2.prototype.public_corpus "$G3_ARTIFACTS"
      - name: Hash all artifacts, including partial failures
        id: artifact_hashes
        if: always()
        timeout-minutes: 2
        run: python -m src.paper2.prototype.runner --hash-artifacts "$G3_ARTIFACTS"
      - name: Verified upload inventory 1
        id: inventory_verified_1
        if: success() && steps.corpus_audit.outcome == 'success' && steps.artifact_hashes.outcome == 'success'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-g3-diagnostic-artifacts/
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 1
        id: seal_verified_1
        if: success() && steps.corpus_audit.outcome == 'success' && steps.artifact_hashes.outcome == 'success'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-g3-diagnostic-artifacts/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.corpus_audit.outcome == 'success' && steps.artifact_hashes.outcome == 'success' && steps.inventory_verified_1.outcome == 'success' && steps.seal_verified_1.outcome == 'success'
        timeout-minutes: 8
        with:
          name: paper2-g3-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paper2-g3-diagnostic-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Verified upload inventory 2
        id: inventory_verified_2
        if: success() && steps.corpus_audit.outcome == 'success' && steps.artifact_hashes.outcome == 'success'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-g3-diagnostic-artifacts/replay-inputs/
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 2
        id: seal_verified_2
        if: success() && steps.corpus_audit.outcome == 'success' && steps.artifact_hashes.outcome == 'success'
        env:
          UPLOAD_PATH: ${{ runner.temp }}/paper2-g3-diagnostic-artifacts/replay-inputs/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - name: Upload audited public replay inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.corpus_audit.outcome == 'success' && steps.artifact_hashes.outcome == 'success' && steps.inventory_verified_2.outcome == 'success' && steps.seal_verified_2.outcome == 'success'
        timeout-minutes: 8
        with:
          name: paper2-g3-diagnostic-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/paper2-g3-diagnostic-artifacts/replay-inputs/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve UNVERIFIED failure evidence only
        id: failure_evidence
        if: failure() || cancelled()
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
          EVIDENCE_0: ${{ runner.temp }}/paper2-g3-diagnostic-artifacts/
          EVIDENCE_1: ${{ runner.temp }}/paper2-g3-diagnostic-artifacts/replay-inputs/
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paper2-failure-evidence"
          echo "UNVERIFIED: failed attempt; inspection only; forbidden as replay or authorization input" > "$RUNNER_TEMP/paper2-failure-evidence/UNVERIFIED"
          if [ -f src/paper2/prototype/failure_evidence.py ]; then
            python -m src.paper2.prototype.failure_evidence --output "$RUNNER_TEMP/paper2-failure-evidence" "$EVIDENCE_0" "$EVIDENCE_1"
          else
            if [ -d "$RUNNER_TEMP/paper2-production/control" ]; then cp -al "$RUNNER_TEMP/paper2-production/control" "$RUNNER_TEMP/paper2-failure-evidence/early-control"; fi
          fi
          if [ -d "$RUNNER_TEMP/paper2-production/failure-upload" ]; then cp -a "$RUNNER_TEMP/paper2-production/failure-upload/." "$RUNNER_TEMP/paper2-failure-evidence/"; fi
      - name: Upload UNVERIFIED failed attempt evidence
        if: (failure() || cancelled()) && steps.failure_evidence.outcome == 'success'
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-attempt-evidence-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/paper2-failure-evidence/
          if-no-files-found: error
          retention-days: 30
