name: paper2-g3-validation-dryrun
on:
  workflow_dispatch:
    inputs:
      timing_source_run_id:
        description: v5 diagnostic source for the separate timing-only job
        type: string
        required: true
        default: '42354911778'
permissions:
  contents: read
  actions: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [pass, band_and_invalid, invalid_invariant, one_invalid, two_invalid, replacement_pass, replacement_fail, replacement_invalid, replacement_invalid_invariant, secondary_missing, secondary_error, secondary_disagree, secondary_invariant, two_source, part_rerun, drain_only, dispatcher_load_only, dip_only]
    env:
      PAPER2_RUNNER_LABEL: ubuntu-24.04
      PYTHONDONTWRITEBYTECODE: '1'
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Set runner-temp paths
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-dryrun-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Prepare SYNTHETIC packets only
        # Synthetic public fixtures use the existing Ed25519 sleep backend.
        # Provisioning is separate from runner self-tests.
        run: |
          python -m pip install --disable-pip-version-check cryptography==45.0.7
          python -m src.paper2.prototype.validation_dryrun create --scenario "$SCENARIO" --output "$RUNNER_TEMP/inputs"
      - name: Full validation prepare, primary and held-out replay, comparisons and sealed gather
        run: python -m src.paper2.prototype.validation_dryrun exercise --scenario "$SCENARIO" --inputs "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/result"
      - name: Verified upload inventory 1
        id: inventory_verified_1
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/result/
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 1
        id: seal_verified_1
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/result/
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.inventory_verified_1.outcome == 'success' && steps.seal_verified_1.outcome == 'success'
        with:
          name: synthetic-validation-${{ github.run_id }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
      - name: Preserve UNVERIFIED failure evidence only
        id: failure_evidence
        if: failure() || cancelled()
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
          EVIDENCE_0: ${{ runner.temp }}/result/
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paper2-failure-evidence"
          echo "UNVERIFIED: failed attempt; inspection only; forbidden as replay or authorization input" > "$RUNNER_TEMP/paper2-failure-evidence/UNVERIFIED"
          if [ -f src/paper2/prototype/failure_evidence.py ]; then
            python -m src.paper2.prototype.failure_evidence --output "$RUNNER_TEMP/paper2-failure-evidence" "$EVIDENCE_0"
          else
            if [ -d "$RUNNER_TEMP/paper2-production/control" ]; then cp -al "$RUNNER_TEMP/paper2-production/control" "$RUNNER_TEMP/paper2-failure-evidence/early-control"; fi
          fi
          if [ -d "$RUNNER_TEMP/paper2-production/failure-upload" ]; then cp -a "$RUNNER_TEMP/paper2-production/failure-upload/." "$RUNNER_TEMP/paper2-failure-evidence/"; fi
      - name: Upload UNVERIFIED failed attempt evidence
        if: (failure() || cancelled()) && steps.failure_evidence.outcome == 'success'
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-attempt-evidence-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/paper2-failure-evidence/
          if-no-files-found: error
          retention-days: 30
  timing_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PAPER2_RUNNER_LABEL: ubuntu-24.04
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set runner-temp paths
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/paper2-timing-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: paper2-g3-diagnostic-inputs-${{ inputs.timing_source_run_id }}
          run-id: ${{ inputs.timing_source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/timing-inputs
      - name: TIMING ONLY primary and held-out simulations; no metrics or comparisons
        run: python -m src.paper2.prototype.validation_dryrun timing --inputs "$RUNNER_TEMP/timing-inputs" --output "$RUNNER_TEMP/timing.json"
      - name: Verified upload inventory 1
        id: inventory_verified_1
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/timing.json
        run: python -m src.paper2.prototype.upload_gate inventory --root "$UPLOAD_PATH"
      - name: Verified upload seal 1
        id: seal_verified_1
        if: success()
        env:
          UPLOAD_PATH: ${{ runner.temp }}/timing.json
        run: python -m src.paper2.prototype.upload_gate seal --root "$UPLOAD_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.inventory_verified_1.outcome == 'success' && steps.seal_verified_1.outcome == 'success'
        with:
          name: timing-only-${{ github.run_id }}
          path: ${{ runner.temp }}/timing.json
          if-no-files-found: error
      - name: Preserve UNVERIFIED failure evidence only
        id: failure_evidence
        if: failure() || cancelled()
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
          EVIDENCE_0: ${{ runner.temp }}/timing.json
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paper2-failure-evidence"
          echo "UNVERIFIED: failed attempt; inspection only; forbidden as replay or authorization input" > "$RUNNER_TEMP/paper2-failure-evidence/UNVERIFIED"
          if [ -f src/paper2/prototype/failure_evidence.py ]; then
            python -m src.paper2.prototype.failure_evidence --output "$RUNNER_TEMP/paper2-failure-evidence" "$EVIDENCE_0"
          else
            if [ -d "$RUNNER_TEMP/paper2-production/control" ]; then cp -al "$RUNNER_TEMP/paper2-production/control" "$RUNNER_TEMP/paper2-failure-evidence/early-control"; fi
          fi
          if [ -d "$RUNNER_TEMP/paper2-production/failure-upload" ]; then cp -a "$RUNNER_TEMP/paper2-production/failure-upload/." "$RUNNER_TEMP/paper2-failure-evidence/"; fi
      - name: Upload UNVERIFIED failed attempt evidence
        if: (failure() || cancelled()) && steps.failure_evidence.outcome == 'success'
        env:
          PAPER2_FAILURE_EVIDENCE: '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-attempt-evidence-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/paper2-failure-evidence/
          if-no-files-found: error
          retention-days: 30
